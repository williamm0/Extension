<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>jx</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── MAIN ──────────────────────────────────────────────────────────────── -->
<div id="app">

  <header>
    <span class="brand">jx<span class="brand-ver" id="brandVer"></span></span>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Update banner — hidden until a new release is found -->
  <div id="updateBanner">
    <span class="update-dot"></span>
    <span class="update-text">Update <strong id="updateTag"></strong> available</span>
    <span id="updateStatus"></span>
    <button id="btnUpdate" class="update-btn" onclick="doInstallUpdate()">Install</button>
  </div>

  <div class="scroll-area">

    <!-- LAYERS -->
    <section>
      <div class="section-hd">
        <span class="section-bar"></span>
        <span class="section-label">Layers</span>
      </div>
      <div class="section-body">
        <button class="tool-btn" id="btnPrecompose">Precompose Selected</button>
        <button class="tool-btn" id="btnFrameBlend">Frame Blending</button>
        <button class="tool-btn" id="btnMotionBlur">Motion Blur</button>
        <button class="tool-btn" id="btnTrimComp">Trim Comp to Work Area</button>
      </div>
    </section>

    <!-- COLOUR -->
    <section>
      <div class="section-hd">
        <span class="section-bar"></span>
        <span class="section-label">Colour</span>
      </div>
      <div class="section-body">

        <div class="file-zone" id="fileZone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="file-zone-name" id="fileZoneName">Drop your .ffx file here</span>
          <span class="file-zone-hint" id="fileZoneHint">or have a browse</span>
          <input type="file" id="ffxInput" accept=".ffx" style="display:none">
        </div>

        <button class="tool-btn accent" id="btnApplyColor" disabled>
          Apply to Adjustment Layer
        </button>

      </div>
    </section>

    <!-- KEYFRAMES -->
    <section>
      <div class="section-hd">
        <span class="section-bar"></span>
        <span class="section-label">Keyframes</span>
      </div>
      <div class="section-body">

        <button class="tool-btn" id="btnStretch">Fit Keys to Clip</button>

        <div class="btn-row">
          <button class="tool-btn flex-1" id="btnCopyGraphs">Copy Graphs</button>
          <button class="tool-btn flex-1" id="btnPasteGraphs" disabled>Paste Graphs</button>
          <button class="tool-btn icon-only" id="btnSaveGraphs" disabled title="Save to library">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
          </button>
        </div>

        <div id="graphLibrary" class="graph-library" style="display:none">
          <div class="graph-library-hd">
            <span class="graph-library-label">Library</span>
          </div>
          <div id="graphList"></div>
        </div>

      </div>
    </section>

  </div>

  <footer>
    <a href="#" id="creditLink">Made by jx</a>
  </footer>

</div>


<!-- ── SETTINGS ───────────────────────────────────────────────────────────── -->
<div id="settingsView" class="settings-view">

  <div class="settings-hd">
    <button class="icon-btn" id="settingsBack">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <span class="settings-title">Settings</span>
  </div>

  <div class="settings-body">

    <div class="settings-group">
      <div class="settings-group-label">Frame Blending Mode</div>
      <div class="radio-row">
        <label class="radio-label"><input type="radio" name="fbMode" value="mix" checked> Frame Mix</label>
        <label class="radio-label"><input type="radio" name="fbMode" value="pixel"> Pixel Motion</label>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">Loaded Preset</div>
      <div class="settings-path" id="settingsPath">None loaded</div>
      <button class="tool-btn small" id="settingsClearPreset">Clear</button>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">Graph Library</div>
      <div id="settingsGraphList"></div>
      <div class="settings-path" id="settingsGraphEmpty">Nothing saved yet.</div>
    </div>

    <div class="settings-footer">
      <span class="version-tag" id="settingsVersion"></span>
    </div>

  </div>
</div>


<!-- ── SAVE MODAL ─────────────────────────────────────────────────────────── -->
<div id="saveModal" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-title">Save Graph</div>
    <input type="text" id="saveInput" class="modal-input" placeholder="Name it..." maxlength="40" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button class="tool-btn small" id="saveCancel">Cancel</button>
      <button class="tool-btn small accent" id="saveConfirm">Save</button>
    </div>
  </div>
</div>


<!-- ── TOAST ──────────────────────────────────────────────────────────────── -->
<div id="toast" class="toast out"></div>


<script src="js/CSInterface.js"></script>
<script src="js/version.js"></script>
<script src="js/updater.js"></script>
<script src="js/main.js"></script>
</body>
</html>
